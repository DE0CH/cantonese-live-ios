# Builds the iOS app on a GitHub macOS runner, walks every flow on an iPhone 17 simulator (the phone replica, streaming
# the bundled Cantonese clip through VAD, segmenting, OpenCC and the UI; the simulator has no Metal for MLX, so a
# stand-in answers for the model there, and model-check runs the real model on a Mac), then archives UNSIGNED and lets
# the export cloud-sign with Apple's managed distribution certificate (App Store Connect API key) and upload to
# TestFlight. The app has no server and no secrets.
name: ios
on:
  workflow_dispatch:
    inputs:
      upload: { description: "Upload to TestFlight", type: boolean, default: true }
      device: { description: "Simulator (iPhone 17 Pro Max gives the 6.9-inch App Store screenshots)", type: string, default: "iPhone 17" }
      appearance: { description: "Simulator appearance", type: choice, options: [light, dark], default: light }
  workflow_call:   # the appstore workflow runs the replica on an iPhone 17 Pro Max for the screenshots
    inputs:
      upload: { type: boolean, default: false }
      device: { type: string, default: "iPhone 17" }
      appearance: { type: string, default: light }
  push:
    branches: [main]
    paths: ["ios/**", "testdata/**", ".github/workflows/ios.yml"]
concurrency: { group: "ios-${{ github.workflow }}-${{ inputs.appearance || 'light' }}", cancel-in-progress: false }
permissions: { contents: read }
defaults:
  run:
    shell: bash -eo pipefail {0}
    working-directory: ios
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Models the app ships with (cached by the pinned revisions in fetch-model.sh)
        uses: actions/cache@v4
        with:
          path: ios/Model
          key: model-${{ hashFiles('ios/fetch-model.sh') }}
      - name: Fetch the models
        run: |
          [ -f Model/asr/model.safetensors ] || { pip3 install -q --break-system-packages huggingface_hub && ./fetch-model.sh; }
          du -sh Model/*
      - name: Xcode, xcodegen
        env:
          # TestFlight already has builds up to 31 from DE0CH/cantonese-live, where this app started.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          BUILD_NUMBER=$((BUILD_NUMBER + 100))
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"; sudo xcode-select -s "$XCODE"; xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain > /dev/null 2>&1 || true   # MLX's shaders
          sed -i '' "s/BUILD_NUMBER: \"1\"/BUILD_NUMBER: \"$BUILD_NUMBER\"/" project.yml
          xcodegen generate --quiet
      # Xcode's build products (MLX and the other packages take most of a cold build, and on a busy runner a cold build
      # can outlast the step). Restored from the newest run with the same packages, saved after every run, even a failed
      # one, so a slow cold build keeps its progress.
      - name: Restore build products
        uses: actions/cache/restore@v4
        with:
          path: ios/DerivedData
          key: dd-${{ hashFiles('ios/project.yml') }}-${{ github.run_id }}-${{ inputs.appearance || 'light' }}
          restore-keys: dd-${{ hashFiles('ios/project.yml') }}-
      - name: Phone replica (simulator, every flow)
        id: replica
        timeout-minutes: 40
        env:
          DEVICE: ${{ inputs.device || 'iPhone 17' }}
          APPEARANCE: ${{ inputs.appearance || 'light' }}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']
          rts=sorted((k for k in d if 'iOS' in k), key=lambda k:[int(x) for x in re.findall(r'\d+',k)])
          for rt in reversed(rts):
              for dev in d[rt]:
                  if dev['name']==sys.argv[1]: print(dev['udid']); sys.exit()
          " "$DEVICE")
          [ -n "$UDID" ] || { echo "no $DEVICE simulator"; exit 1; }
          xcrun simctl boot "$UDID" 2>/dev/null || true
          # Wait for a full boot: testing a half-booted simulator can leave XCTest "waiting for workers to materialize".
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl ui "$UDID" appearance "$APPEARANCE"
          # App Store screenshots: a clean status bar (9:41, full signal and battery).
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          # A stuck test fails on its own (XCTest's 15 min allowance), and a stuck xcodebuild is stopped before the step's
          # timeout, so the log, the app's lines and the screenshots below are always printed.
          ( sleep 1800; echo "watchdog: stopping xcodebuild" >> "$RUNNER_TEMP/test.log"; pkill -INT xcodebuild ) & WATCHDOG=$!
          mkdir -p "$RUNNER_TEMP/screens"
          COMMON=(-project Cantonese.xcodeproj -scheme Cantonese -configuration Release -destination "id=$UDID"
            -derivedDataPath DerivedData -skipPackagePluginValidation -skipMacroValidation ONLY_ACTIVE_ARCH=YES ARCHS=arm64
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO)
          xcodebuild build-for-testing "${COMMON[@]}" > "$RUNNER_TEMP/build.log" 2>&1 || true
          grep -E "error:|\*\* TEST BUILD" "$RUNNER_TEMP/build.log" | head -20 || true
          xcodebuild test-without-building "${COMMON[@]}" -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 900 > "$RUNNER_TEMP/test.log" 2>&1 || true
          kill $WATCHDOG 2>/dev/null || true
          tail -25 "$RUNNER_TEMP/test.log"
          grep -E "error:|\*\* TEST|Test Case .*(passed|failed)|TRANSCRIPT|XCTAssert" "$RUNNER_TEMP/test.log" | head -40 || true
          grep -A12 -E "The following build commands failed|Testing failed:" "$RUNNER_TEMP/test.log" | head -60 || true
          xcrun simctl spawn "$UDID" log show --last 90m --style compact \
            --predicate 'subsystem == "dev.de0ch.cantonese"' 2>/dev/null | tail -60 || true
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$RUNNER_TEMP/att" >/dev/null 2>&1 || true
          python3 - "$RUNNER_TEMP/att" "$RUNNER_TEMP/screens" <<'PY' || true
          import json, os, shutil, sys
          src, dst = sys.argv[1:]
          n = 0
          for t in json.load(open(os.path.join(src, "manifest.json"))):
              for a in t.get("attachments", []):
                  f = a.get("exportedFileName", "")
                  if f.endswith(".png"):
                      n += 1; shutil.copy(os.path.join(src, f), os.path.join(dst, "%02d-%s.png" % (n, a.get("suggestedHumanReadableName", f).split("_")[0])))
          print(f"screenshots: {n}")
          PY
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" "$RUNNER_TEMP/test.log"
      - name: Save build products
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ios/DerivedData
          key: dd-${{ hashFiles('ios/project.yml') }}-${{ github.run_id }}-${{ inputs.appearance || 'light' }}
      - name: Keep the replica screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replica-screens-${{ inputs.appearance || 'light' }}
          path: |
            ${{ runner.temp }}/screens/*.png
            ${{ runner.temp }}/test.log
          if-no-files-found: ignore
      - name: Archive (unsigned)
        if: (github.event_name == 'push' && github.workflow == 'ios') || inputs.upload   # never from the appstore workflow's replica
        run: |
          xcodebuild archive -project Cantonese.xcodeproj -scheme Cantonese -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            -archivePath "$RUNNER_TEMP/app.xcarchive" -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > "$RUNNER_TEMP/archive.log" 2>&1 || true
          grep -E "error:|\*\* ARCHIVE" "$RUNNER_TEMP/archive.log" | head -40 || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"
      - name: Export, cloud-sign and upload to TestFlight
        if: (github.event_name == 'push' && github.workflow == 'ios') || inputs.upload   # never from the appstore workflow's replica
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"; printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"; trap 'rm -f "$KEY"' EXIT
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1 || true
          grep -E "error|EXPORT|Upload|Uploaded|uploaded" "$RUNNER_TEMP/export.log" | sed "s#$RUNNER_TEMP/##" | tail -n 25 || true
          grep -qE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" "$RUNNER_TEMP/export.log"
