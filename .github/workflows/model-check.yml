# Runs the app's model (aufklarer/Qwen3-ASR-1.7B-MLX-5bit, Qwen3-ASR 1.7B on MLX) on a macOS runner with speech-swift's
# own CLI at the app's pinned revision: transcribes the test clip and prints the text and timing; then runs the app's loop
# over the App Store demo (tools/replay). The iPhone simulator can't run MLX (no Metal), so this is where CI hears the
# model.
name: model-check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/project.yml", "ios/fetch-model.sh", "ios/App/Worker.swift", "tools/replay/**", "testdata/**",
            ".github/workflows/model-check.yml"]
permissions: { contents: read }
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: speech-swift CLI at the app's revision
        run: |
          URL=$(awk '/SpeechSwift:/{f=1} f&&/url:/{print $2; exit}' ios/project.yml)
          REV=$(awk '/SpeechSwift:/{f=1} f&&/revision:/{print $2; exit}' ios/project.yml)
          git clone -q "$URL" "$RUNNER_TEMP/ss" && git -C "$RUNNER_TEMP/ss" checkout -q "$REV"
          cd "$RUNNER_TEMP/ss"
          xcodebuild -downloadComponent MetalToolchain > /dev/null 2>&1 || true
          make build 2>&1 | tail -3
          sysctl -n machdep.cpu.brand_string hw.memsize
      - name: Transcribe the test clip
        run: |
          cd "$RUNNER_TEMP/ss"
          BIN=.build/release/audio
          "$BIN" transcribe "$GITHUB_WORKSPACE/testdata/cantonese-16k.wav" --engine qwen3 -m aufklarer/Qwen3-ASR-1.7B-MLX-5bit 2>&1 | tail -15
          time "$BIN" transcribe "$GITHUB_WORKSPACE/testdata/cantonese-16k.wav" --engine qwen3 -m aufklarer/Qwen3-ASR-1.7B-MLX-5bit 2>&1 | tail -15 | tee out.txt
          grep -q "我哋" out.txt
      - name: The app's loop over the demo conversation with the real model (tools/replay)
        # Every pass it makes goes in the artifact as demo-16k.passes.json: committed to testdata/demo, it is what the
        # simulator's stand-in answers in the App Store demo. The log shows the screen after each pass.
        run: |
          REV=$(awk '/SpeechSwift:/{f=1} f&&/revision:/{print $2; exit}' ios/project.yml)
          grep -q "$REV" tools/replay/Package.swift || { echo "tools/replay pins another speech-swift than ios/project.yml"; exit 1; }
          pip3 install -q --break-system-packages huggingface_hub && ios/fetch-model.sh
          cd tools/replay
          swift build -c release 2>&1 | tail -3
          BUILD_DIR=.build "$RUNNER_TEMP/ss/scripts/build_mlx_metallib.sh" release 2>&1 | tail -2
          .build/release/replay ../../ios/Model/asr ../../testdata/demo/demo-16k.wav "$RUNNER_TEMP/demo-16k.passes.json"
          diff -q "$RUNNER_TEMP/demo-16k.passes.json" ../../testdata/demo/demo-16k.passes.json \
            || echo "::notice::the demo's passes differ from testdata/demo/demo-16k.passes.json (commit the artifact's copy)"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: demo-passes, path: "${{ runner.temp }}/demo-16k.passes.json", if-no-files-found: ignore }
