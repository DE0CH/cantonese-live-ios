# Loads the App Store listing into App Store Connect (ios/fastlane: text, categories, age rating, screenshots, free
# price, availability, content rights) with the App Store Connect API key. The screenshots are made by tools/storeart
# (a headline over the screenshot in a phone frame) from the replica's demo test on an iPhone 17 Pro Max simulator
# (6.9-inch, 1320 x 2868) in light and dark. It runs on every push to main that changes the listing or what the
# screenshots show, so App Store Connect always matches git. It never submits for review.
name: appstore
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/fastlane/**", "ios/App/**", "ios/UITests/**", "testdata/demo/**", "tools/storeart/**",
            ".github/workflows/appstore.yml", ".github/workflows/ios.yml"]
concurrency: { group: appstore, cancel-in-progress: true }   # the newest listing wins
permissions: { contents: read }
jobs:
  replica:
    strategy: { matrix: { appearance: [light, dark] } }
    uses: ./.github/workflows/ios.yml
    with:
      upload: false
      device: iPhone 17 Pro Max
      appearance: ${{ matrix.appearance }}
    secrets: inherit
  listing:
    needs: replica
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: replica-screens-*, path: "${{ runner.temp }}/screens" }
      - name: Noto Sans HK and SC (notofonts/noto-cjk, pinned)
        run: |
          F="$RUNNER_TEMP/fonts"; mkdir -p "$F"
          for r in HK SC; do for w in Bold Regular; do
            curl -sSfL -o "$F/NotoSans$r-$w.otf" "https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/SubsetOTF/$r/NotoSans$r-$w.otf"
          done; done
          sha256sum -c <<EOF
          4bce16fbed09278cbdfb4d57749500038cdda70737925a846e3f6c59327ab46e  $F/NotoSansHK-Bold.otf
          8a43afea92bb58dfd9027bd7ac6f5b0b2662e2ffb3e7c1edc02c62b2b21924f1  $F/NotoSansHK-Regular.otf
          c6cb5a93abaa9edc8ee7463b7ebb7f42d618d40e6ed2f7a5371c97b0b64767c0  $F/NotoSansSC-Bold.otf
          faa6c9df652116dde789d351359f3d7e5d2285a2b2a1f04a2d7244df706d5ea9  $F/NotoSansSC-Regular.otf
          EOF
      - name: Screenshots for every localization (tools/storeart)
        run: |
          S="$RUNNER_TEMP/screens"; ls -R "$S"
          cargo build -q --release --locked --manifest-path ../tools/storeart/Cargo.toml
          ART=../tools/storeart/target/release/storeart
          $ART stills --light "$S/replica-screens-light" --dark "$S/replica-screens-dark" --fonts "$RUNNER_TEMP/fonts" --out fastlane/screenshots
          python3 -c "import struct,glob;[print(f,struct.unpack('>IIBB',open(f,'rb').read()[16:26])) for f in sorted(glob.glob('fastlane/screenshots/*/*.png'))]"
      - name: Keep the screenshots
        uses: actions/upload-artifact@v4
        with: { name: store-screenshots, path: ios/fastlane/screenshots }
      - name: Load the listing (no review submission)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          sudo gem install fastlane --no-document > /dev/null
          fastlane listing
